<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JARVIS // COMMAND MODE</title>
<style>
  :root{
    --bg:#03070d; --panel:rgba(10,22,34,.55); --line:rgba(0,212,255,.18);
    --cyan:#00d4ff; --amber:#ff9600; --green:#00ff88; --red:#ff4c4c;
    --txt:#bfe9f5; --dim:#5b7c8a; --mono:'JetBrains Mono','Consolas',monospace;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;background:var(--bg);color:var(--txt);font-family:var(--mono);overflow:hidden}
  body{background:
      radial-gradient(1100px 760px at 50% 46%, rgba(0,70,110,.13), transparent 70%),
      repeating-linear-gradient(0deg, transparent 0 38px, rgba(0,212,255,.022) 38px 39px),
      repeating-linear-gradient(90deg, transparent 0 38px, rgba(0,212,255,.022) 38px 39px),
      var(--bg);}
  .vig{position:fixed;inset:0;pointer-events:none;box-shadow:inset 0 0 240px 70px rgba(0,0,0,.9)}

  /* top bar */
  .topbar{position:fixed;top:0;left:0;right:0;height:56px;display:flex;align-items:center;
    justify-content:space-between;padding:0 26px;border-bottom:1px solid var(--line);
    background:linear-gradient(180deg,rgba(0,20,30,.6),transparent);z-index:5}
  .brand{display:flex;align-items:center;gap:14px;letter-spacing:5px;font-weight:700}
  .brand b{color:var(--cyan);text-shadow:0 0 14px rgba(0,212,255,.6)}
  .brand .sub{color:var(--dim);font-size:11px;letter-spacing:3px}
  .sysdot{width:9px;height:9px;border-radius:50%;background:var(--green);box-shadow:0 0 12px var(--green)}
  .sysdot.off{background:var(--red);box-shadow:0 0 12px var(--red)}
  .modes{display:flex;gap:8px}
  .modes a{font-size:10px;letter-spacing:2px;color:var(--dim);text-decoration:none;
    border:1px solid var(--line);padding:5px 11px;border-radius:18px}
  .modes a.on{color:var(--cyan);border-color:var(--cyan);background:rgba(0,212,255,.08)}
  .modes a:hover{color:var(--cyan)}

  .stage{position:fixed;inset:56px 0 34px 0;display:grid;
    grid-template-columns:320px 1fr 320px;align-items:stretch}

  .panel{margin:18px;border:1px solid var(--line);background:var(--panel);backdrop-filter:blur(7px);
    border-radius:10px;padding:16px;box-shadow:0 0 0 1px rgba(0,0,0,.4) inset,0 14px 40px rgba(0,0,0,.5);position:relative}
  .panel::before{content:'';position:absolute;top:-1px;left:14px;right:14px;height:1px;
    background:linear-gradient(90deg,transparent,var(--cyan),transparent);opacity:.5}
  .ptitle{font-size:11px;letter-spacing:3px;color:var(--cyan);margin-bottom:13px;display:flex;align-items:center;gap:8px}
  .ptitle::after{content:'';flex:1;height:1px;background:var(--line)}

  .row{display:flex;justify-content:space-between;align-items:center;padding:8px 0;
    border-bottom:1px dashed rgba(0,212,255,.08);font-size:12px}
  .row .k{color:var(--dim);letter-spacing:1px}
  .v{color:var(--txt);font-weight:600}
  .v.ok{color:var(--green)} .v.bad{color:var(--red)} .v.warn{color:var(--amber)}
  .gauge{height:7px;border-radius:6px;background:rgba(0,212,255,.1);overflow:hidden;margin-top:8px}
  .gauge>i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--cyan),var(--green));
    box-shadow:0 0 10px var(--cyan);transition:width .6s}

  /* center reactor */
  .core{position:relative;display:flex;align-items:center;justify-content:center}
  #arc{filter:drop-shadow(0 0 26px rgba(0,212,255,.22))}
  .cabs{position:absolute;text-align:center;pointer-events:none}
  .cabs .time{font-size:40px;letter-spacing:5px;color:#eafaff;text-shadow:0 0 18px rgba(0,212,255,.55)}
  .cabs .agent{font-size:14px;letter-spacing:8px;margin-top:4px;color:var(--cyan)}
  .cabs .state{font-size:10px;letter-spacing:4px;margin-top:9px;color:var(--dim)}

  /* ops */
  .stat3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:9px;margin:4px 0 16px}
  .stat{border:1px solid var(--line);border-radius:8px;padding:11px 4px;text-align:center;background:rgba(0,212,255,.04)}
  .stat .n{font-size:25px;color:#dff6ff;text-shadow:0 0 12px rgba(0,212,255,.4)}
  .stat .l{font-size:9px;letter-spacing:2px;color:var(--dim);margin-top:3px}
  .fleet{display:grid;grid-template-columns:1fr 1fr;gap:6px}
  .agent{display:flex;align-items:center;gap:7px;font-size:10.5px;padding:6px 8px;border-radius:6px;
    border:1px solid rgba(255,255,255,.05);background:rgba(255,255,255,.015)}
  .agent .dot{width:8px;height:8px;border-radius:50%;box-shadow:0 0 8px currentColor;flex:none}
  .agent.live{border-color:var(--cyan);background:rgba(0,212,255,.08)}

  .ticker{position:fixed;bottom:0;left:0;right:0;height:34px;border-top:1px solid var(--line);
    background:linear-gradient(0deg,rgba(0,20,30,.7),transparent);overflow:hidden;display:flex;align-items:center;z-index:5}
  .ticker .scroll{white-space:nowrap;font-size:11px;letter-spacing:2px;color:var(--dim);
    animation:slide 40s linear infinite;padding-left:100%}
  .ticker .scroll b{color:var(--cyan)}
  @keyframes slide{to{transform:translateX(-100%)}}
  .clock-tr{font-size:20px;letter-spacing:3px;color:#dff6ff;text-shadow:0 0 10px rgba(0,212,255,.4)}
</style>
</head>
<body>
<div class="vig"></div>

<div class="topbar">
  <div class="brand"><span class="sysdot" id="sysdot"></span>
    <span><b>J.A.R.V.I.S</b> <span class="sub">// COMMAND</span></span></div>
  <div class="modes">
    <a class="on" href="/hud/c">COMMAND</a>
    <a href="#" title="next phase">OPERATIONS</a>
    <a href="#" title="next phase">CYBER</a>
  </div>
  <div class="clock-tr" id="clock">--:--:--</div>
</div>

<div class="stage">
  <!-- LEFT SYSTEMS -->
  <div class="panel">
    <div class="ptitle">SYSTEMS</div>
    <div class="row"><span class="k">OLLAMA</span><span class="v" id="s-ollama">—</span></div>
    <div class="row"><span class="k">MODEL</span><span class="v" id="s-model">—</span></div>
    <div class="row"><span class="k">WHISPER STT</span><span class="v" id="s-whisper">—</span></div>
    <div class="row"><span class="k">TTS</span><span class="v" id="s-tts">—</span></div>
    <div class="row"><span class="k">BROWSER</span><span class="v" id="s-browser">—</span></div>
    <div class="row"><span class="k">SCHEDULER</span><span class="v" id="s-sched">—</span></div>
    <div class="row" style="border:none"><span class="k">AUTOTUNE</span><span class="v ok">ENABLED</span></div>
    <div class="ptitle" style="margin-top:16px">STORAGE</div>
    <div class="row" style="border:none"><span class="k">DISK FREE</span><span class="v" id="s-disk">—</span></div>
    <div class="gauge"><i id="s-diskbar"></i></div>
  </div>

  <!-- CENTER REACTOR -->
  <div class="core">
    <canvas id="arc" width="560" height="560"></canvas>
    <div class="cabs">
      <div class="time" id="ctime">--:--:--</div>
      <div class="agent" id="cagent">FRIDAY</div>
      <div class="state" id="cstate">STANDBY</div>
    </div>
  </div>

  <!-- RIGHT OPS -->
  <div class="panel">
    <div class="ptitle">OPERATIONS</div>
    <div class="stat3">
      <div class="stat"><div class="n" id="o-tasks">0</div><div class="l">TASKS</div></div>
      <div class="stat"><div class="n" id="o-rem">0</div><div class="l">REMIND</div></div>
      <div class="stat"><div class="n" id="o-evt">0</div><div class="l">EVENTS</div></div>
    </div>
    <div class="ptitle">AGENT FLEET · 15</div>
    <div class="fleet" id="fleet"></div>
  </div>
</div>

<div class="ticker"><div class="scroll" id="ticker">INITIALIZING…</div></div>

<script>
const AGENT_COLORS={friday:'#00ffcc',athena:'#b48eff',ultron:'#ff4c4c',veronica:'#4ca6ff',
  vision:'#ffb347',edith:'#1adfb2',echo:'#ff8ad6',personal:'#4cff8a',system:'#9ad0ff',
  file:'#a0a0a0',scheduler:'#ffd24c',self_improvement:'#7CFFB2',terminator:'#ff6b3d',
  n8n:'#d36cff',routines:'#6cffe0'};
const FLEET=Object.keys(AGENT_COLORS);

/* clock */
function tick(){const t=new Date().toLocaleTimeString('en-GB');
  document.getElementById('clock').textContent=t;document.getElementById('ctime').textContent=t;}
setInterval(tick,1000);tick();

/* fleet */
const fleetEl=document.getElementById('fleet');
FLEET.forEach(a=>fleetEl.insertAdjacentHTML('beforeend',
  `<div class="agent" data-a="${a}"><span class="dot" style="color:${AGENT_COLORS[a]}"></span>${a.toUpperCase()}</div>`));

/* ── arc reactor (house HUD_RINGS DNA) ── */
const cv=document.getElementById('arc'),x=cv.getContext('2d');
const CX=cv.width/2,CY=cv.height/2;
let CORE={r:0,g:212,b:255};
const RINGS=[
  {r:266,lw:0.6,sp:0.003,d: 1,tk:0, ar:1, gp:0,   a:0.16},
  {r:244,lw:1.0,sp:0.005,d:-1,tk:90,ar:1, gp:0,   a:0.28},
  {r:218,lw:2.4,sp:0.010,d: 1,tk:0, ar:12,gp:0.16,a:0.95},
  {r:190,lw:1.2,sp:0.020,d:-1,tk:48,ar:6, gp:0.12,a:0.65},
  {r:162,lw:2.0,sp:0.034,d: 1,tk:0, ar:4, gp:0.22,a:0.6},
  {r:136,lw:0.8,sp:0.055,d:-1,tk:30,ar:3, gp:0.15,a:0.42},
  {r:112,lw:3.0,sp:0.014,d: 1,tk:0, ar:8, gp:0.10,a:0.85},
];
const rots=RINGS.map(()=>Math.random()*7);
const col=a=>`rgba(${CORE.r},${CORE.g},${CORE.b},${a})`;
function drawRing(R,rot){
  x.save();x.translate(CX,CY);x.rotate(rot);
  x.lineWidth=R.lw;x.strokeStyle=col(R.a);x.shadowBlur=10;x.shadowColor=col(R.a*0.8);
  if(R.tk){for(let i=0;i<R.tk;i++){const a=(i/R.tk)*7;
    x.beginPath();x.moveTo(Math.cos(a)*(R.r-3),Math.sin(a)*(R.r-3));
    x.lineTo(Math.cos(a)*(R.r+3),Math.sin(a)*(R.r+3));x.stroke();}}
  else if(R.ar>1){const seg=Math.PI*2/R.ar,gap=seg*R.gp;
    for(let i=0;i<R.ar;i++){x.beginPath();x.arc(0,0,R.r,i*seg+gap/2,(i+1)*seg-gap/2);x.stroke();}}
  else{x.beginPath();x.arc(0,0,R.r,0,7);x.stroke();}
  x.restore();
}
function drawCore(){
  const g=x.createRadialGradient(CX,CY,4,CX,CY,100);
  g.addColorStop(0,col(0.45));g.addColorStop(0.4,col(0.1));g.addColorStop(1,'transparent');
  x.fillStyle=g;x.beginPath();x.arc(CX,CY,100,0,7);x.fill();
  x.strokeStyle=col(0.9);x.lineWidth=2;x.shadowBlur=16;x.shadowColor=col(0.9);
  x.beginPath();for(let i=0;i<3;i++){const a=-Math.PI/2+i*(2*Math.PI/3)+rots[2];
    const px=CX+Math.cos(a)*50,py=CY+Math.sin(a)*50;i?x.lineTo(px,py):x.moveTo(px,py);}
  x.closePath();x.stroke();
}
function frame(){x.clearRect(0,0,cv.width,cv.height);drawCore();
  RINGS.forEach((R,i)=>{rots[i]+=R.sp*R.d;drawRing(R,rots[i]);});x.shadowBlur=0;
  requestAnimationFrame(frame);}
frame();

/* ── live data ── */
async function poll(){
  try{
    const st=await (await fetch('/status')).json();
    const ag=(st.last_agent||'friday').toLowerCase();
    const c=AGENT_COLORS[ag]||'#00d4ff';
    const m=c.match(/\w\w/g).map(h=>parseInt(h,16));CORE={r:m[0],g:m[1],b:m[2]};
    const A=document.getElementById('cagent');A.textContent=ag.toUpperCase();A.style.color=c;
    document.getElementById('o-tasks').textContent=st.tasks_pending||0;
    document.getElementById('o-rem').textContent=st.reminders_pending||0;
    document.getElementById('o-evt').textContent=st.events_today||0;
    document.querySelectorAll('.agent').forEach(e=>e.classList.toggle('live',e.dataset.a===ag));
    document.getElementById('cstate').textContent=st.ollama_online?'● ONLINE · LISTENING':'○ OLLAMA OFFLINE';
    document.getElementById('sysdot').classList.toggle('off',!st.ollama_online);
  }catch(e){document.getElementById('sysdot').classList.add('off');
    document.getElementById('cstate').textContent='○ DISCONNECTED';}
  try{
    const h=await (await fetch('/health')).json();
    const set=(id,t,cls)=>{const e=document.getElementById(id);e.textContent=t;e.className='v '+(cls||'');};
    set('s-ollama',h.ollama.up?'ONLINE':'OFFLINE',h.ollama.up?'ok':'bad');
    set('s-model',h.ollama.model,h.ollama.model_loaded?'ok':'warn');
    set('s-whisper',h.whisper.loaded?'LOADED · '+h.whisper.model:'COLD',h.whisper.loaded?'ok':'warn');
    set('s-tts',(h.tts.backend||'—').toUpperCase()+(h.tts.kokoro_worker_alive?' ✓':''),h.tts.kokoro_worker_alive?'ok':'warn');
    set('s-browser',h.browser.enabled?'ENABLED':'OFF',h.browser.enabled?'ok':'');
    set('s-sched',h.scheduler.running?'RUNNING':'IDLE',h.scheduler.running?'ok':'warn');
    if(h.disk&&h.disk.free_gb!=null){set('s-disk',h.disk.free_gb+' GB',h.disk.pct_used>90?'bad':'');
      document.getElementById('s-diskbar').style.width=(100-h.disk.pct_used)+'%';}
    document.getElementById('ticker').innerHTML=
      (`<b>OLLAMA</b> ${h.ollama.model} · <b>STT</b> ${h.whisper.model} · <b>TTS</b> ${h.tts.backend} · `+
       `<b>DISK</b> ${h.disk.free_gb||'?'}GB free · <b>SCHED</b> ${h.scheduler.running?'up':'idle'} · `+
       `JARVIS LOCAL AI · 15 AGENTS · AUTOTUNE ON · HACKINGTOOL FLEET ARMED · `).repeat(2);
  }catch(e){}
}
poll();setInterval(poll,5000);
</script>
</body>
</html>
