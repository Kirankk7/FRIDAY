name: tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  regression:
    runs-on: ubuntu-latest
    env:
      JARVIS_CI: "1"              # skip non-deterministic live-API + Ollama tests
      PYTHONUTF8: "1"
      SDL_VIDEODRIVER: "dummy"    # let pygame import on a headless runner
      SDL_AUDIODRIVER: "dummy"
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install CI dependencies (slim)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-ci.txt

      - name: Run regression suite (offline subset)
        run: python test_regression.py
